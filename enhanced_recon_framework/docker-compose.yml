services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recon_framework
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: ${RECON_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon_user -d recon_framework"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  recon-framework:
    build: .
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wordlists:/app/wordlists:ro
      - recon_logs:/app/logs
      - screenshots_data:/app/screenshots
      - exports_data:/app/exports
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: .
    command: ["python", "dashboard.py"]
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wordlists:/app/wordlists:ro
      - screenshots_data:/app/screenshots:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://recon_user:${RECON_DB_PASSWORD}@postgres:5432/recon_framework?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  recon_logs:
  screenshots_data:
  exports_data:
